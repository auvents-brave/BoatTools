# Builds the Windows bridge DLLs the ThoosaUno companion app P/Invokes —
# BoatToolsBridge from this repository and SthenoBridge from the (public)
# Stheno sibling — plus the Swift runtime DLLs they need, assembled into one
# artifact. ThoosaUno's Scripts/package-downloads.sh fetches the latest
# artifact to package the Windows download (ThoosaUno itself is private, so
# its own Actions cannot build them; Swift also cannot cross-compile to
# Windows from macOS or Linux).
name: Bridge Windows

on:
  push:
    branches: [main, lab]
    paths:
      - "Bridge/**"
      - ".github/workflows/bridge-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.3.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          path: BoatTools
      # SthenoBridge lives in the Stheno sibling — same ref name, so a lab
      # build pairs with Stheno's lab and a main build with its main.
      - uses: actions/checkout@v6
        with:
          repository: auvents-brave/Stheno
          ref: ${{ github.ref_name }}
          path: Stheno

      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-${{ env.SWIFT_VERSION }}-release
          tag: ${{ env.SWIFT_VERSION }}-RELEASE

      - name: Cache vcpkg-built libcurl
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-curl-websockets-x64-windows-static-md-v1
      # Static triplet (dynamic CRT, matching the Swift runtime) so the
      # bridges are self-contained — no libcurl/zlib DLLs to ship.
      - name: Install libcurl (websockets feature, static)
        run: vcpkg install curl[websockets]:x64-windows-static-md

      - name: Build SthenoBridge
        working-directory: Stheno/Bridge
        run: swift build -c release

      - name: Build BoatToolsBridge
        working-directory: BoatTools/Bridge
        run: >-
          swift build -c release
          -Xcc "-I$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\include"
          -Xlinker "/LIBPATH:$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib"

      # The bridges link the Swift runtime dynamically: ship its DLLs next to
      # them so the packaged app needs no Swift installed. The runtime folder
      # is located by finding swiftCore.dll under the toolchain install.
      - name: Assemble bridges + Swift runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item Stheno\Bridge\.build\release\SthenoBridge.dll stage\
          Copy-Item BoatTools\Bridge\.build\release\BoatToolsBridge.dll stage\
          $core = Get-ChildItem -Path "$env:ProgramFiles\Swift" -Recurse -Filter swiftCore.dll |
            Select-Object -First 1
          if (-not $core) { Write-Error "swiftCore.dll not found under $env:ProgramFiles\Swift"; exit 1 }
          Write-Host "Swift runtime: $($core.DirectoryName)"
          Copy-Item "$($core.DirectoryName)\*.dll" stage\ -Force
          Get-ChildItem stage | Format-Table Name, Length

      - name: Upload bridges artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridges-windows-x64
          path: stage
